<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-labelledby="lt">
  <title id="lt">Language split across 10 public repositories: Python 41%, Rust 28%, JavaScript 15%, HTML 5%, CSS 5%, Shell 4%, Other 1%</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F8FC"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F59E6B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F59E6B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4F8DF7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4F8DF7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="21" height="21" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.05" fill="#DCE4EF" fill-opacity="0.8"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="998" height="228" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="230" fill="url(#bg)"/>
    <rect width="1000" height="230" fill="url(#dots)"/>
    <ellipse cx="60" cy="10" rx="300" ry="150" fill="url(#glowA)"/>
    <ellipse cx="950" cy="230" rx="300" ry="150" fill="url(#glowB)"/>

    <text x="56" y="44" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="3.2" fill="#F59E6B">LANGUAGES &#183; PUBLIC REPOS</text>
    <text x="944" y="44" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#8595A8">
      10 repos &#183; 2.3 MB of code
    </text>

      <rect x="56.0" y="66" width="359.4" height="26" rx="4" fill="#4F8DF7"><title>Python — 41.3%</title></rect>
      <rect x="418.4" y="66" width="246.9" height="26" rx="4" fill="#F0A87B"><title>Rust — 28.4%</title></rect>
      <rect x="668.3" y="66" width="131.4" height="26" rx="4" fill="#E4C76C"><title>JavaScript — 15.1%</title></rect>
      <rect x="802.6" y="66" width="46.8" height="26" rx="4" fill="#C97B5A"><title>HTML — 5.4%</title></rect>
      <rect x="852.4" y="66" width="43.7" height="26" rx="4" fill="#8B7BD8"><title>CSS — 5.0%</title></rect>
      <rect x="899.2" y="66" width="30.6" height="26" rx="4" fill="#6EE7B7"><title>Shell — 3.5%</title></rect>
      <rect x="932.7" y="66" width="11.3" height="26" rx="4" fill="#8B949E"><title>Other — 1.3%</title></rect>
      <circle cx="61.0" cy="132.0" r="5" fill="#4F8DF7"/><text x="75.0" y="136" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#33445B">Python</text><text x="252.0" y="136" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#6B7C92">41.3%</text>
      <circle cx="283.0" cy="132.0" r="5" fill="#F0A87B"/><text x="297.0" y="136" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#33445B">Rust</text><text x="474.0" y="136" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#6B7C92">28.4%</text>
      <circle cx="505.0" cy="132.0" r="5" fill="#E4C76C"/><text x="519.0" y="136" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#33445B">JavaScript</text><text x="696.0" y="136" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#6B7C92">15.1%</text>
      <circle cx="727.0" cy="132.0" r="5" fill="#C97B5A"/><text x="741.0" y="136" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#33445B">HTML</text><text x="918.0" y="136" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#6B7C92">5.4%</text>
      <circle cx="61.0" cy="166.0" r="5" fill="#8B7BD8"/><text x="75.0" y="170" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#33445B">CSS</text><text x="252.0" y="170" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#6B7C92">5.0%</text>
      <circle cx="283.0" cy="166.0" r="5" fill="#6EE7B7"/><text x="297.0" y="170" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#33445B">Shell</text><text x="474.0" y="170" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#6B7C92">3.5%</text>
      <circle cx="505.0" cy="166.0" r="5" fill="#8B949E"/><text x="519.0" y="170" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#33445B">Other</text><text x="696.0" y="170" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#6B7C92">1.3%</text>

    <path d="M56 196 h888" stroke="#E1E8F1" stroke-width="1"/>
    <text x="56" y="216" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#8595A8">bytes per language, from the GitHub API &#183; top 6 + other</text>
  </g>
  <rect x="1" y="1" width="998" height="228" rx="18" fill="none" stroke="#E1E8F1" stroke-width="1"/>
