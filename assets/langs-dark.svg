<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-labelledby="lt">
  <title id="lt">Language split across 11 public repositories: Python 41%, Rust 36%, JavaScript 11%, HTML 4%, CSS 4%, Shell 3%, Other 2%</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E15"/><stop offset="1" stop-color="#0C1220"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F0A87B" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#F0A87B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4F8DF7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4F8DF7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="21" height="21" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.05" fill="#1A2433" fill-opacity="0.55"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="998" height="228" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="230" fill="url(#bg)"/>
    <rect width="1000" height="230" fill="url(#dots)"/>
    <ellipse cx="60" cy="10" rx="300" ry="150" fill="url(#glowA)"/>
    <ellipse cx="950" cy="230" rx="300" ry="150" fill="url(#glowB)"/>

    <text x="56" y="44" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="3.2" fill="#F0A87B">LANGUAGES &#183; PUBLIC REPOS</text>
    <text x="944" y="44" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#5C6B7F">
      11 repos &#183; 3.2 MB of code
    </text>

      <rect x="56.0" y="66" width="358.1" height="26" rx="4" fill="#4F8DF7"><title>Python — 41.2%</title></rect>
