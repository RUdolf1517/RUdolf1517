      <rect x="899.2" y="66" width="25.7" height="26" rx="4" fill="#6EE7B7"><title>Shell — 3.0%</title></rect>
      <rect x="927.9" y="66" width="16.1" height="26" rx="4" fill="#8B949E"><title>Other — 1.9%</title></rect>
      <circle cx="61.0" cy="132.0" r="5" fill="#4F8DF7"/><text x="75.0" y="136" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#C3D2E4">Python</text><text x="252.0" y="136" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#7C8CA1">41.2%</text>
      <circle cx="283.0" cy="132.0" r="5" fill="#F0A87B"/><text x="297.0" y="136" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#C3D2E4">Rust</text><text x="474.0" y="136" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#7C8CA1">35.9%</text>
      <circle cx="505.0" cy="132.0" r="5" fill="#E4C76C"/><text x="519.0" y="136" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#C3D2E4">JavaScript</text><text x="696.0" y="136" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#7C8CA1">10.6%</text>
      <circle cx="727.0" cy="132.0" r="5" fill="#C97B5A"/><text x="741.0" y="136" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#C3D2E4">HTML</text><text x="918.0" y="136" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#7C8CA1">3.9%</text>
      <circle cx="61.0" cy="166.0" r="5" fill="#8B7BD8"/><text x="75.0" y="170" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#C3D2E4">CSS</text><text x="252.0" y="170" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#7C8CA1">3.5%</text>
      <circle cx="283.0" cy="166.0" r="5" fill="#6EE7B7"/><text x="297.0" y="170" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#C3D2E4">Shell</text><text x="474.0" y="170" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#7C8CA1">3.0%</text>
      <circle cx="505.0" cy="166.0" r="5" fill="#8B949E"/><text x="519.0" y="170" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#C3D2E4">Other</text><text x="696.0" y="170" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#7C8CA1">1.9%</text>

    <path d="M56 196 h888" stroke="#1D2837" stroke-width="1"/>
    <text x="56" y="216" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#5C6B7F">bytes per language, from the GitHub API &#183; top 6 + other</text>
