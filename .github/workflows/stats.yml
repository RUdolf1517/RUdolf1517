name: stats cards

on:
  schedule:
    - cron: "17 4 * * 1"      # every Monday, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/gen_stats.py
          python3 scripts/gen_langs.py

      - name: Commit if the numbers moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/commits-dark.svg assets/commits-light.svg \
                                 assets/langs-dark.svg assets/langs-light.svg; then
            echo "No change in the data, nothing to do."
            exit 0
          fi
          git add assets/commits-dark.svg assets/commits-light.svg \
                  assets/langs-dark.svg assets/langs-light.svg
          git commit -m "Refresh stats cards"
          git push
