name: stats cards

on:
  schedule:
    # Every 6 hours: 00:17, 06:17, 12:17 and 18:17 UTC. GitHub queues scheduled
    # runs, so allow for a few minutes of delay at busy times.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/gen_stats.py
          python3 scripts/gen_langs.py

      # Commits at most once a day: the numbers move, or the "updated" date
      # turns over. A run that finds both unchanged exits here and writes nothing.
      - name: Commit if the numbers moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/commits-dark.svg assets/commits-light.svg \
                                 assets/langs-dark.svg assets/langs-light.svg; then
            echo "No change in the data, nothing to do."
            exit 0
          fi
          git add assets/commits-dark.svg assets/commits-light.svg \
                  assets/langs-dark.svg assets/langs-light.svg
          git commit -m "Refresh stats cards"
          git pull --rebase origin main
          git push
